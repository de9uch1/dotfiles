[tools]
"aqua:ajeetdsouza/zoxide" = "latest"
"aqua:bootandy/dust" = { version = "latest", libc = "musl" }
"aqua:BurntSushi/ripgrep" = { version = "latest", libc = "musl" }
"aqua:chmln/sd" = { version = "latest", libc = "musl" }
"aqua:jgm/pandoc" = "latest"
"aqua:jqlang/jq" = "latest"
"aqua:junegunn/fzf" = "latest"
"aqua:koalaman/shellcheck" = "latest"
"aqua:lsd-rs/lsd" = { version = "latest", libc = "musl" }
"aqua:mvdan/sh" = "latest"
"aqua:openai/codex" = "latest"
"aqua:sharkdp/bat" = { version = "latest", libc = "musl" }
"aqua:sharkdp/fd" = { version = "latest", libc = "musl" }
"aqua:sharkdp/hyperfine" = { version = "latest", libc = "musl" }
"aqua:skim-rs/skim" = { version = "latest", libc = "musl" }
"aqua:starship/starship" = { version = "latest", libc = "musl" }
"aqua:x-motemen/ghq" = "latest"
"github:dalance/procs" = "latest"
"github:fornwall/rust-script" = { version = "latest", libc = "musl" }
"github:imsnif/bandwhich" = { version = "latest", libc = "musl" }
"github:jadestrong/lsp-proxy" = "latest"
"github:wfxr/csview" = { version = "latest", libc = "musl" }
node = "lts"
"npm:bash-language-server" = "latest"
pueue = { version = "latest", matching = "pueue-" }
pueued = { version = "latest", matching = "pueued-" }
github-cli = "latest"

[tool_alias]
pueue = "github:Nukesor/pueue"
pueued = "github:Nukesor/pueue"

[settings]
minimum_release_age = "3d"

[settings.node]
compile = false

[dotfiles]
"~/.bash_profile" = {}
"~/.bashrc" = {}
"~/.clisprc.lisp" = {}
"~/.gitconfig" = {}
"~/.gitignore_global" = {}
"~/.hgignore" = {}
"~/.hgrc" = {}
"~/.sbclrc" = {}
"~/.screenrc" = {}
"~/.tmux.conf" = {}
"~/.vim" = {}
"~/.config/alacritty.yml" = {}
"~/.config/fish" = {}
"~/.config/profile" = {}
"~/.config/ptpython" = {}
"~/Library/Application Support/ptpython/config.py" = { source = "~/.dotfiles/.config/ptpython/config.py", variants = [{ os = "macos" }] }
"~/.config/pueue/pueue.yml.sample" = {}
"~/.config/starship.toml" = {}
"~/.config/systemd/user/pueued.service" = {}
"~/.config/terminfo-alacritty.info" = {}
"~/.config/terminfo-xterm-24bits.info" = {}
"~/.config/wezterm" = {}
"~/bin" = { mode = "symlink-each", manifest = "git" }

[bootstrap.hooks]
post-repos = 'git -C "$HOME/.dotfiles" submodule update --init'
post-dotfiles = '"$HOME/.dotfiles/.config/mise/hooks/copy-wezterm-wsl"'
